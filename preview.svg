        <g transform="translate(300,38)"><rect width="24" height="18" rx="3" fill="#007749"/></g>

        <!-- card 2 -->
        <g transform="translate(0,98)">
          <rect width="332" height="86" rx="14" fill="#141d30" stroke="#243352"/>
          <text x="166" y="22" fill="#8a99b8" font-size="11" text-anchor="middle">J1 · jeu. 11 juin</text>
          <g transform="translate(14,38)"><rect width="24" height="18" rx="3" fill="#c60c30"/><rect x="9" width="6" height="18" fill="#fff"/></g>
          <text x="118" y="52" fill="#eef3ff" font-size="13" font-weight="600" text-anchor="end">Corée Sud</text>
          <rect x="126" y="36" width="24" height="28" rx="8" fill="#1b2742"/><text x="138" y="55" fill="#eef3ff" font-size="16" text-anchor="middle">−</text>
          <rect x="152" y="35" width="30" height="32" rx="8" fill="#0f1626" stroke="#243352"/><text x="167" y="55" fill="#8a99b8" font-size="16" text-anchor="middle">·</text>
          <text x="190" y="56" fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle">:</text>
          <rect x="198" y="35" width="30" height="32" rx="8" fill="#0f1626" stroke="#243352"/><text x="213" y="55" fill="#8a99b8" font-size="16" text-anchor="middle">·</text>
          <rect x="230" y="36" width="24" height="28" rx="8" fill="#1b2742"/><text x="242" y="55" fill="#eef3ff" font-size="16" text-anchor="middle">+</text>
