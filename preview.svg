<svg xmlns="http://www.w3.org/2000/svg" width="880" height="840" viewBox="0 0 880 840" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e0a4"/><stop offset="1" stop-color="#00a3ff"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1322"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
  </defs>
  <rect width="880" height="840" fill="#070a12"/>

  <!-- flag helpers drawn inline -->
  <!-- ============ PHONE 1 : Pronos, nouvelle carte match ============ -->
  <g transform="translate(24,24)">
    <rect width="392" height="792" rx="40" fill="#1a2336"/>
    <rect x="6" y="6" width="380" height="780" rx="34" fill="url(#page)"/>
    <g transform="translate(24,30)">
      <text x="0" y="22" fill="#eef3ff" font-size="22" font-weight="800">Mes pronostics</text>

      <!-- subtabs -->
      <g transform="translate(0,38)">
        <rect width="332" height="48" rx="14" fill="#0f1626" stroke="#243352"/>
        <rect x="5" y="5" width="161" height="38" rx="10" fill="#1b2742"/>
        <circle cx="38" cy="24" r="8" fill="none" stroke="#00e0a4" stroke-width="2"/>
        <text x="56" y="29" fill="#eef3ff" font-size="13" font-weight="700">Phase de groupes</text>
        <path d="M205 16h12l-2 12h-8z" fill="none" stroke="#8a99b8" stroke-width="1.8"/>
        <text x="226" y="29" fill="#8a99b8" font-size="13" font-weight="700">Tableau final</text>
      </g>

      <!-- segment Par groupe / Par date -->
      <g transform="translate(0,96)">
        <rect width="332" height="40" rx="12" fill="#0f1626" stroke="#243352"/>
        <rect x="4" y="4" width="162" height="32" rx="9" fill="#1b2742"/>
        <text x="85" y="25" fill="#eef3ff" font-size="13" font-weight="700" text-anchor="middle">Par groupe</text>
        <text x="249" y="25" fill="#8a99b8" font-size="13" font-weight="700" text-anchor="middle">Par date</text>
      </g>

      <!-- group chips -->
      <g transform="translate(0,148)">
        <rect width="40" height="40" rx="12" fill="url(#grad)"/>
        <text x="20" y="27" fill="#04211a" font-size="16" font-weight="800" text-anchor="middle">A</text>
        <g fill="#141d30" stroke="#243352"><rect x="48" width="40" height="40" rx="12"/><rect x="96" width="40" height="40" rx="12"/><rect x="144" width="40" height="40" rx="12"/><rect x="192" width="40" height="40" rx="12"/><rect x="240" width="40" height="40" rx="12"/><rect x="288" width="40" height="40" rx="12"/></g>
        <g fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle"><text x="68" y="27">B</text><text x="116" y="27">C</text><text x="164" y="27">D</text><text x="212" y="27">E</text><text x="260" y="27">F</text><text x="308" y="27">G</text></g>
      </g>

      <!-- MATCH CARD 1 (rempli) -->
      <g transform="translate(0,204)">
        <rect width="332" height="128" rx="16" fill="#141d30" stroke="#00e0a4" stroke-opacity="0.4"/>
        <text x="14" y="24" fill="#8a99b8" font-size="11">Groupe A · J1 · jeu. 11 juin · Mexico City</text>
        <!-- row Mexique -->
        <g transform="translate(14,38)">
          <rect width="30" height="22" rx="4" fill="#0a6b3b"/><rect x="10" width="10" height="22" fill="#fff"/><rect x="20" width="10" height="22" fill="#d52b1e"/>
          <text x="42" y="17" fill="#eef3ff" font-size="15" font-weight="600">Mexique</text>
          <!-- stepper -->
          <rect x="180" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="197" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">−</text>
          <rect x="220" y="-4" width="40" height="32" rx="9" fill="#0f1626" stroke="#243352"/><text x="240" y="18" fill="#eef3ff" font-size="18" font-weight="800" text-anchor="middle">2</text>
          <rect x="266" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="283" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">+</text>
        </g>
        <line x1="14" y1="74" x2="318" y2="74" stroke="#243352"/>
        <!-- row Afrique du Sud -->
        <g transform="translate(14,86)">
          <rect width="30" height="22" rx="4" fill="#007749"/><rect y="7" width="30" height="8" fill="#ffb612"/>
          <text x="42" y="17" fill="#eef3ff" font-size="15" font-weight="600">Afrique du Sud</text>
          <rect x="180" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="197" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">−</text>
          <rect x="220" y="-4" width="40" height="32" rx="9" fill="#0f1626" stroke="#243352"/><text x="240" y="18" fill="#eef3ff" font-size="18" font-weight="800" text-anchor="middle">1</text>
          <rect x="266" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="283" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">+</text>
        </g>
      </g>

      <!-- MATCH CARD 2 (vide : 0 à la place du −) -->
      <g transform="translate(0,344)">
        <rect width="332" height="128" rx="16" fill="#141d30" stroke="#243352"/>
        <text x="14" y="24" fill="#8a99b8" font-size="11">Groupe A · J1 · jeu. 11 juin · Guadalajara</text>
        <g transform="translate(14,38)">
          <rect width="30" height="22" rx="4" fill="#c60c30"/><rect x="11" width="8" height="22" fill="#fff"/>
          <text x="42" y="17" fill="#eef3ff" font-size="15" font-weight="600">Corée du Sud</text>
          <rect x="180" y="-3" width="34" height="30" rx="9" fill="#0f1626"/><text x="197" y="17" fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle">0</text>
          <rect x="220" y="-4" width="40" height="32" rx="9" fill="#0f1626" stroke="#243352"/>
          <rect x="266" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="283" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">+</text>
        </g>
        <line x1="14" y1="74" x2="318" y2="74" stroke="#243352"/>
        <g transform="translate(14,86)">
          <rect width="30" height="22" rx="4" fill="#11457e"/><rect y="0" width="30" height="11" fill="#fff"/><rect y="15" width="30" height="7" fill="#d7141a"/>
          <text x="42" y="17" fill="#eef3ff" font-size="15" font-weight="600">Tchéquie</text>
          <rect x="180" y="-3" width="34" height="30" rx="9" fill="#0f1626"/><text x="197" y="17" fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle">0</text>
          <rect x="220" y="-4" width="40" height="32" rx="9" fill="#0f1626" stroke="#243352"/>
          <rect x="266" y="-3" width="34" height="30" rx="9" fill="#1b2742"/><text x="283" y="17" fill="#eef3ff" font-size="18" text-anchor="middle">+</text>
        </g>
      </g>
    </g>

    <!-- bottom nav 6 -->
    <g transform="translate(6,706)">
      <rect width="380" height="80" fill="#0a0e1ae6"/><line x1="0" y1="0" x2="380" y2="0" stroke="#243352"/>
      <g font-size="9" font-weight="700" text-anchor="middle">
        <g><circle cx="32" cy="24" r="8" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="32" y="50" fill="#8a99b8">Accueil</text></g>
        <g><circle cx="95" cy="24" r="8" fill="none" stroke="#00e0a4" stroke-width="2"/><text x="95" y="50" fill="#00e0a4">Pronos</text></g>
        <g><path d="M150 18h14l-2 12h-10z" fill="none" stroke="#8a99b8" stroke-width="1.8"/><text x="158" y="50" fill="#8a99b8">Buteur</text></g>
        <g><path d="M214 18h12l-1 12h-10z" fill="none" stroke="#8a99b8" stroke-width="1.8"/><text x="221" y="50" fill="#8a99b8">Classt</text></g>
        <g><circle cx="285" cy="22" r="6" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="285" y="50" fill="#8a99b8">Ligue</text></g>
        <g><circle cx="348" cy="24" r="8" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="348" y="50" fill="#8a99b8">Résult</text></g>
      </g>
    </g>
  </g>

  <!-- ============ PHONE 2 : Onglet Buteur ============ -->
  <g transform="translate(464,24)">
    <rect width="392" height="792" rx="40" fill="#1a2336"/>
    <rect x="6" y="6" width="380" height="780" rx="34" fill="url(#page)"/>
    <g transform="translate(24,30)">
      <text x="0" y="22" fill="#eef3ff" font-size="22" font-weight="800">Meilleur buteur</text>
      <rect x="250" y="2" width="82" height="26" rx="13" fill="#1b2742" stroke="#243352"/>
      <text x="291" y="20" fill="#eef3ff" font-size="13" font-weight="700" text-anchor="middle">+10 pts</text>
      <text x="0" y="52" fill="#8a99b8" font-size="13">Qui finira meilleur buteur de la Coupe</text>
      <text x="0" y="70" fill="#8a99b8" font-size="13">du Monde ? Choisis un favori.</text>

      <!-- grid of scorer cards -->
      <g transform="translate(0,86)">
        <!-- card selected: Mbappé -->
        <g>
          <rect width="161" height="64" rx="14" fill="#152a28" stroke="#00e0a4"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#11457e"/><rect x="9" width="9" height="19" fill="#fff"/><rect x="18" width="8" height="19" fill="#ef4135"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">K. Mbappé</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">France</text>
          <circle cx="143" cy="32" r="11" fill="url(#grad)"/><path d="M138 32l3.5 3.5 6-7" fill="none" stroke="#04211a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- Haaland -->
        <g transform="translate(171,0)">
          <rect width="161" height="64" rx="14" fill="#141d30" stroke="#243352"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#ba0c2f"/><rect x="7" width="5" height="19" fill="#fff"/><rect y="7" width="26" height="5" fill="#fff"/><rect x="8" width="3" height="19" fill="#00205b"/><rect y="8" width="26" height="3" fill="#00205b"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">E. Haaland</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">Norvège</text>
        </g>
        <!-- Kane -->
        <g transform="translate(0,76)">
          <rect width="161" height="64" rx="14" fill="#141d30" stroke="#243352"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#fff"/><rect x="11" width="4" height="19" fill="#ce1124"/><rect y="7" width="26" height="4" fill="#ce1124"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">H. Kane</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">Angleterre</text>
        </g>
        <!-- Messi -->
        <g transform="translate(171,76)">
          <rect width="161" height="64" rx="14" fill="#141d30" stroke="#243352"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#75aadb"/><rect y="6" width="26" height="7" fill="#fff"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">L. Messi</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">Argentine</text>
        </g>
        <!-- Vinicius -->
        <g transform="translate(0,152)">
          <rect width="161" height="64" rx="14" fill="#141d30" stroke="#243352"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#009b3a"/><circle cx="13" cy="9.5" r="6" fill="#fedf00"/><circle cx="13" cy="9.5" r="2.6" fill="#012169"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">Vinícius Jr</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">Brésil</text>
        </g>
        <!-- Ronaldo -->
        <g transform="translate(171,152)">
          <rect width="161" height="64" rx="14" fill="#141d30" stroke="#243352"/>
          <g transform="translate(12,22)"><rect width="26" height="19" rx="3" fill="#006600"/><rect x="10" width="16" height="19" fill="#ff0000"/></g>
          <text x="46" y="29" fill="#eef3ff" font-size="13" font-weight="700">C. Ronaldo</text>
          <text x="46" y="45" fill="#8a99b8" font-size="11">Portugal</text>
        </g>
        <!-- Autre joueur -->
        <g transform="translate(0,228)">
          <rect width="332" height="60" rx="14" fill="#141d30" stroke="#243352" stroke-dasharray="5 4"/>
          <circle cx="28" cy="30" r="11" fill="none" stroke="#8a99b8" stroke-width="2"/><circle cx="28" cy="26" r="4" fill="none" stroke="#8a99b8" stroke-width="2"/><path d="M21 36c1.5-3 12.5-3 14 0" fill="none" stroke="#8a99b8" stroke-width="2"/>
          <text x="50" y="27" fill="#eef3ff" font-size="13" font-weight="700">Autre joueur</text>
          <text x="50" y="43" fill="#8a99b8" font-size="11">Saisie libre</text>
        </g>
      </g>

      <!-- share button -->
      <g transform="translate(0,408)">
        <rect width="332" height="50" rx="12" fill="url(#grad)"/>
        <text x="166" y="31" fill="#04211a" font-size="15" font-weight="800" text-anchor="middle">Partager mes pronos</text>
      </g>
    </g>

    <!-- bottom nav 6 (Buteur actif) -->
    <g transform="translate(6,706)">
      <rect width="380" height="80" fill="#0a0e1ae6"/><line x1="0" y1="0" x2="380" y2="0" stroke="#243352"/>
      <g font-size="9" font-weight="700" text-anchor="middle">
        <g><circle cx="32" cy="24" r="8" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="32" y="50" fill="#8a99b8">Accueil</text></g>
        <g><circle cx="95" cy="24" r="8" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="95" y="50" fill="#8a99b8">Pronos</text></g>
        <g><path d="M150 18h14l-2 12h-10z" fill="none" stroke="#00e0a4" stroke-width="1.8"/><text x="158" y="50" fill="#00e0a4">Buteur</text></g>
        <g><path d="M214 18h12l-1 12h-10z" fill="none" stroke="#8a99b8" stroke-width="1.8"/><text x="221" y="50" fill="#8a99b8">Classt</text></g>
        <g><circle cx="285" cy="22" r="6" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="285" y="50" fill="#8a99b8">Ligue</text></g>
        <g><circle cx="348" cy="24" r="8" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="348" y="50" fill="#8a99b8">Résult</text></g>
      </g>
    </g>
  </g>

  <text x="440" y="832" fill="#5a6a85" font-size="12" text-anchor="middle">Aperçu : nouvelle carte de match (noms complets, 0 quand vide) &amp; onglet Meilleur buteur</text>
</svg>
