    </g>

    <!-- bottom nav -->
    <g transform="translate(6,706)">
      <rect width="380" height="80" fill="#0a0e1ad9"/>
      <line x1="0" y1="0" x2="380" y2="0" stroke="#243352"/>
      <g font-size="10" font-weight="700" text-anchor="middle">
        <g><circle cx="38" cy="26" r="9" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="38" y="52" fill="#8a99b8">Accueil</text></g>
        <g><circle cx="114" cy="26" r="9" fill="none" stroke="#00e0a4" stroke-width="2"/><text x="114" y="52" fill="#00e0a4">Pronos</text></g>
        <g><path d="M183 19h14l-2 14h-10z" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="190" y="52" fill="#8a99b8">Classt</text></g>
        <g><circle cx="266" cy="22" r="6" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="266" y="52" fill="#8a99b8">Ligue</text></g>
        <g><circle cx="342" cy="26" r="9" fill="none" stroke="#8a99b8" stroke-width="2"/><text x="342" y="52" fill="#8a99b8">Résultats</text></g>
      </g>
    </g>
  </g>

  <text x="440" y="832" fill="#5a6a85" font-size="12" text-anchor="middle">Pronos CM 2026 — aperçu : phase de groupes (gauche) &amp; tableau final / phases finales (droite)</text>
</svg>
