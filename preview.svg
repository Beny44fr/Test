<svg xmlns="http://www.w3.org/2000/svg" width="880" height="840" viewBox="0 0 880 840" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e0a4"/><stop offset="1" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1322"/><stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="840" fill="#070a12"/>

  <!-- ============ PHONE 1 : Phase de groupes ============ -->
  <g transform="translate(24,24)">
    <rect width="392" height="792" rx="40" fill="#1a2336"/>
    <rect x="6" y="6" width="380" height="780" rx="34" fill="url(#page)"/>
    <g transform="translate(24,30)">
      <!-- header -->
      <text x="0" y="22" fill="#eef3ff" font-size="22" font-weight="800">Mes pronostics</text>
      <!-- subtabs -->
      <g transform="translate(0,40)">
        <rect width="332" height="50" rx="14" fill="#0f1626" stroke="#243352"/>
        <rect x="5" y="5" width="161" height="40" rx="10" fill="#1b2742"/>
        <circle cx="40" cy="25" r="8" fill="none" stroke="#00e0a4" stroke-width="2"/>
        <text x="58" y="30" fill="#eef3ff" font-size="13" font-weight="700">Phase de groupes</text>
        <path d="M205 17h12l-2 12h-8z" fill="none" stroke="#8a99b8" stroke-width="1.8"/>
        <text x="226" y="30" fill="#8a99b8" font-size="13" font-weight="700">Tableau final</text>
      </g>
      <!-- group chips -->
      <g transform="translate(0,108)">
        <rect width="42" height="42" rx="12" fill="url(#grad)"/>
        <text x="21" y="28" fill="#04211a" font-size="16" font-weight="800" text-anchor="middle">A</text>
        <g fill="#141d30" stroke="#243352">
          <rect x="50" width="42" height="42" rx="12"/><rect x="100" width="42" height="42" rx="12"/>
          <rect x="150" width="42" height="42" rx="12"/><rect x="200" width="42" height="42" rx="12"/>
          <rect x="250" width="42" height="42" rx="12"/><rect x="300" width="42" height="42" rx="12"/>
        </g>
        <g fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle">
          <text x="71" y="28">B</text><text x="121" y="28">C</text><text x="171" y="28">D</text>
          <text x="221" y="28">E</text><text x="271" y="28">F</text><text x="321" y="28">G</text>
        </g>
      </g>

      <!-- match cards -->
      <g transform="translate(0,168)">
        <!-- card 1 -->
        <rect width="332" height="86" rx="14" fill="#141d30" stroke="#00e0a4" stroke-opacity="0.45"/>
        <text x="166" y="22" fill="#8a99b8" font-size="11" text-anchor="middle">J1 · jeu. 11 juin</text>
        <!-- Mexique -->
        <g transform="translate(14,38)"><rect width="24" height="18" rx="3" fill="#0a6b3b"/><rect width="24" height="6" rx="0" fill="#d52b1e" y="12"/><rect width="24" height="6" fill="#fff" y="6"/></g>
        <text x="118" y="52" fill="#eef3ff" font-size="13" font-weight="600" text-anchor="end">Mexique</text>
        <!-- stepper -->
        <rect x="126" y="36" width="24" height="28" rx="8" fill="#1b2742"/><text x="138" y="55" fill="#eef3ff" font-size="16" text-anchor="middle">−</text>
        <rect x="152" y="35" width="30" height="32" rx="8" fill="#0f1626" stroke="#243352"/><text x="167" y="57" fill="#eef3ff" font-size="16" font-weight="800" text-anchor="middle">2</text>
        <text x="190" y="56" fill="#8a99b8" font-size="16" font-weight="800" text-anchor="middle">:</text>
        <rect x="198" y="35" width="30" height="32" rx="8" fill="#0f1626" stroke="#243352"/><text x="213" y="57" fill="#eef3ff" font-size="16" font-weight="800" text-anchor="middle">0</text>
        <rect x="230" y="36" width="24" height="28" rx="8" fill="#1b2742"/><text x="242" y="55" fill="#eef3ff" font-size="16" text-anchor="middle">+</text>
