        <text x="44" y="30" fill="#8a99b8" font-size="13" font-weight="700">Phase de groupes</text>
        <path d="M212 16h14l-2 13h-10z" fill="none" stroke="#00e0a4" stroke-width="2"/>
        <text x="234" y="30" fill="#eef3ff" font-size="13" font-weight="700">Tableau final</text>
      </g>

      <!-- champion banner -->
      <g transform="translate(0,104)">
        <rect width="332" height="48" rx="14" fill="#2a2410" stroke="#ffd24a" stroke-opacity="0.4"/>
        <path d="M16 18h12l-2 13h-8z" fill="none" stroke="#ffd24a" stroke-width="2"/>
        <text x="40" y="29" fill="#ffd24a" font-size="13" font-weight="600">Champion pronostiqué :</text>
        <g transform="translate(186,15)"><rect width="22" height="16" rx="3" fill="#6cade0"/><rect width="22" height="6" y="5" fill="#fff"/></g>
        <text x="214" y="29" fill="#eef3ff" font-size="13" font-weight="800">Argentine</text>
      </g>

      <!-- round chips -->
