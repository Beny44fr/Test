          <text x="46" y="27" fill="#00e0a4" font-size="14" font-weight="700">France</text>
          <circle cx="312" cy="22" r="16" fill="url(#grad)"/>
          <path d="M305 22l5 5 9-10" fill="none" stroke="#04211a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Sénégal row -->
          <g transform="translate(14,52)"><rect width="22" height="16" rx="3" fill="#00853f"/><rect x="7" width="8" height="16" fill="#fdef42"/><rect x="15" width="7" height="16" fill="#e31b23"/></g>
          <text x="46" y="65" fill="#eef3ff" font-size="14" font-weight="600">Sénégal</text>
          <circle cx="312" cy="60" r="16" fill="#1b2742" stroke="#243352"/>
          <path d="M305 60l5 5 9-10" fill="none" stroke="#8a99b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
        </g>
        <!-- M2 -->
        <g transform="translate(0,104)">
          <rect width="332" height="92" rx="14" fill="#141d30" stroke="#00e0a4" stroke-opacity="0.35"/>
          <text x="312" y="20" fill="#8a99b8" font-size="10" font-weight="800" text-anchor="end">M2</text>
          <g transform="translate(14,14)"><rect width="22" height="16" rx="3" fill="#009b3a"/><circle cx="11" cy="8" r="5" fill="#fedf00"/><circle cx="11" cy="8" r="2.4" fill="#012169"/></g>
          <text x="46" y="27" fill="#00e0a4" font-size="14" font-weight="700">Brésil</text>
          <circle cx="312" cy="22" r="16" fill="url(#grad)"/>
          <path d="M305 22l5 5 9-10" fill="none" stroke="#04211a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(14,52)"><rect width="22" height="16" rx="3" fill="#c1272d"/></g>
          <text x="46" y="65" fill="#eef3ff" font-size="14" font-weight="600">Maroc</text>
          <circle cx="312" cy="60" r="16" fill="#1b2742" stroke="#243352"/>
        </g>
        <!-- M3 -->
        <g transform="translate(0,208)">
          <rect width="332" height="92" rx="14" fill="#141d30" stroke="#00e0a4" stroke-opacity="0.35"/>
          <text x="312" y="20" fill="#8a99b8" font-size="10" font-weight="800" text-anchor="end">M3</text>
          <g transform="translate(14,14)"><rect width="22" height="16" rx="3" fill="#6cade0"/><rect width="22" height="6" y="5" fill="#fff"/></g>
          <text x="46" y="27" fill="#00e0a4" font-size="14" font-weight="700">Argentine</text>
          <circle cx="312" cy="22" r="16" fill="url(#grad)"/>
          <path d="M305 22l5 5 9-10" fill="none" stroke="#04211a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <g transform="translate(14,52)"><rect width="22" height="16" rx="3" fill="#012169"/></g>
          <text x="46" y="65" fill="#eef3ff" font-size="14" font-weight="600">Australie</text>
          <circle cx="312" cy="60" r="16" fill="#1b2742" stroke="#243352"/>
        </g>
