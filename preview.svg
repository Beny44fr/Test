        <text x="31" y="26" fill="#04211a" font-size="13" font-weight="800" text-anchor="middle">16es</text>
        <g fill="#141d30" stroke="#243352">
          <rect x="70" width="54" height="40" rx="12"/><rect x="132" width="74" height="40" rx="12"/>
          <rect x="214" width="64" height="40" rx="12"/><rect x="286" width="66" height="40" rx="12"/>
        </g>
        <g fill="#8a99b8" font-size="13" font-weight="800" text-anchor="middle">
          <text x="97" y="26">8es</text><text x="169" y="26">Quarts</text>
          <text x="246" y="26">Demis</text><text x="319" y="26">Finale</text>
        </g>
      </g>

      <!-- KO match cards -->
      <g transform="translate(0,224)">
        <!-- M1 -->
        <g>
          <rect width="332" height="92" rx="14" fill="#141d30" stroke="#00e0a4" stroke-opacity="0.35"/>
          <text x="312" y="20" fill="#8a99b8" font-size="10" font-weight="800" text-anchor="end">M1</text>
          <!-- France row (winner) -->
