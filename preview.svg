  <!-- ============ PHONE 2 : Tableau final ============ -->
  <g transform="translate(464,24)">
    <rect width="392" height="792" rx="40" fill="#1a2336"/>
    <rect x="6" y="6" width="380" height="780" rx="34" fill="url(#page)"/>
    <g transform="translate(24,30)">
      <text x="0" y="22" fill="#eef3ff" font-size="22" font-weight="800">Mes pronostics</text>
      <!-- subtabs (Tableau final actif) -->
